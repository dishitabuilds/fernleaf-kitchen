# Free assignment-review fallback. Provisioning/account access is a separate step.
services:
  - type: web
    name: fernleaf-kitchen-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: pnpm --filter @fernleaf/api start:demo-deploy
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fernleaf-kitchen-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: SESSION_TTL_HOURS
        value: '12'
      - key: DEMO_FIXTURES_ENABLED
        value: 'true'
      - key: MAINTENANCE_TOKEN
        generateValue: true
databases:
  - name: fernleaf-kitchen-db
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    databaseName: fernleaf
    user: fernleaf
    ipAllowList: []
