services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: fernleaf
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: fernleaf
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - fernleaf-postgres:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fernleaf -d fernleaf']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  fernleaf-postgres:
